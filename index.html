<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khizer's Portfolio</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav>
      <h3>Muhammad Khizer</h3>

      <input type="checkbox" id="click" />

      <label for="click">
        <img class="menu-btn" src="svgs/menu.svg" alt="menu button" />
        <img class="cancel-btn" src="svgs/cancel.svg" alt="cancel button" />
      </label>

      <ul>
        <li><a href="#about">About</a></li>
        <li><a href="#skills">Skills</a></li>
        <li><a href="#work">Work</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>

    <main>
      <section id="hero">
        <div class="left">
          <h1>
            Hey! I Am Muhammad Khizer a <br />
            <span class="auto-type"></span>
          </h1>
        </div>

        <div class="right">
          <img src="./svgs/developer.svg" alt="" />
        </div>
      </section>

      <section id="skills">
        <h2 class="section-title">My Skills</h2>
        <div class="all-skills">
          <div class="skill">
            <div class="skill-logo">
              <img src="./svgs/skills svgs/html.svg" alt="" />
            </div>
            <div class="skill-name">
              <h3>Html 5</h3>
            </div>
          </div>

          <div class="skill">
            <div class="skill-logo">
              <img src="./svgs/skills svgs/css.svg" alt="" />
            </div>
            <div class="skill-name">
              <h3>Css 3</h3>
            </div>
          </div>

          <div class="skill">
            <div class="skill-logo large-logo">
              <img class=" large-img" src="./svgs/skills svgs/javascript.svg" alt="" />
            </div>
            <div class="skill-name">
              <h3>JavaScript</h3>
            </div>
          </div>

          <div class="skill">
            <div class="skill-logo large-logo">
              <img class="large-img" src="./svgs/skills svgs/bootstrap.svg" alt="" />
            </div>
            <div class="skill-name">
              <h3>Bootstrap</h3>
            </div>
          </div>

          <div class="skill">
            <div class="skill-logo">
              <img src="./svgs/skills svgs/react.svg" alt="" />
            </div>
            <div class="skill-name">
              <h3>React</h3>
            </div>
          </div>

          <div class="skill">
            <div class="skill-logo">
              <img src="./svgs/skills svgs/node-js.svg" alt="" />
            </div>
            <div class="skill-name">
              <h3>Node.js</h3>
            </div>
          </div>
          <div class="skill">
            <div class="skill-logo large-logo">
              <img class="large-img" src="./svgs/skills svgs/express.svg" alt="" />
            </div>
            <div class="skill-name">
              <h3>Express.js</h3>
            </div>
          </div>

          <div class="skill">
            <div class="skill-logo">
              <img src="./svgs/skills svgs/mongodb.svg" alt="" />
            </div>
            <div class="skill-name">
              <h3>MongoDB</h3>
            </div>
          </div>

          
            
        </div>
      </section>
    </main>

    <script src="https://unpkg.com/typed.js@3.0.0/dist/typed.umd.js"></script>
    <script src="script.js"></script>
  </body>
</html>
